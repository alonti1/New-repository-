<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd6e7">
<title>Our Little Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fb8; --deep:#e6457f; --soft:#ffe3ee; --cream:#fff8fb; --ink:#6b2c47;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; min-height:100vh; font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffd6e7 0%,#ffe9f2 45%,#fff3e8 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  /* Hebrew uses a font that supports Hebrew letters */
  html[lang="he"] body, html[lang="he"] button, html[lang="he"] input{font-family:'Rubik','Quicksand',sans-serif}
  html[lang="he"] h1, html[lang="he"] .card h2{font-family:'Rubik',sans-serif; font-weight:600}
  html[lang="he"] .quote{font-style:normal}

  .hearts{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .heart{position:absolute; bottom:-40px; opacity:.55; animation:float linear infinite}
  @keyframes float{to{transform:translateY(-110vh) rotate(25deg); opacity:0}}
  main{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:28px 16px 48px}
  h1{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); text-align:center; font-size:2.1rem; margin:8px 0 4px}
  .sub{text-align:center; margin:0 0 22px; font-weight:600}
  .card{
    background:rgba(255,255,255,.82); border-radius:28px; padding:22px 18px; margin-bottom:18px;
    box-shadow:0 10px 30px rgba(230,69,127,.15); border:2px solid #fff;
  }
  .card h2{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); margin:0 0 14px; text-align:center; font-size:1.35rem}
  .count{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .unit{background:var(--soft); border-radius:18px; padding:12px 4px; text-align:center}
  .unit b{display:block; font-size:1.9rem; color:var(--deep)}
  .unit span{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .done{text-align:center; font-size:1.4rem; font-weight:700; color:var(--deep)}
  .bar{height:16px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:18px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),var(--deep)); border-radius:99px; transition:width 1s}
  .barlabel{text-align:center; font-size:.9rem; margin-top:8px}
  .size{text-align:center}
  .fruit{font-size:5rem; line-height:1; animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
  .size p{margin:6px 0}
  .big{font-size:1.25rem; font-weight:700; color:var(--deep)}
  .stats{display:flex; gap:10px; justify-content:center; margin-top:10px}
  .stat{background:var(--soft); padding:10px 16px; border-radius:16px; font-weight:700}
  .stat small{display:block; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .quote{text-align:center; font-size:1.15rem; font-style:italic; min-height:84px; display:flex; align-items:center; justify-content:center; transition:opacity .4s}
  button{
    display:block; margin:14px auto 0; border:0; background:linear-gradient(135deg,var(--pink),var(--deep));
    color:#fff; font:700 1rem 'Quicksand',sans-serif; padding:12px 26px; border-radius:99px;
    box-shadow:0 6px 16px rgba(230,69,127,.35); cursor:pointer;
  }
  button:active{transform:scale(.96)}
  button:disabled{opacity:.6; cursor:default}
  #lang{
    position:fixed; top:12px; inset-inline-end:12px; z-index:5; margin:0;
    padding:8px 16px; font-size:.9rem; background:rgba(255,255,255,.9); color:var(--deep);
    box-shadow:0 4px 12px rgba(230,69,127,.25); border:2px solid var(--pink);
  }
  footer{text-align:center; font-size:.9rem; margin-top:8px}
  .note{font-size:.75rem; opacity:.7; text-align:center; margin-top:8px}

  /* ---- name guess poll ---- */
  .poll-form{display:flex; gap:8px}
  .poll-form input{
    flex:1; min-width:0; border:2px solid var(--pink); border-radius:99px; padding:12px 16px;
    font:600 1rem 'Quicksand',sans-serif; color:var(--ink); background:#fff;
  }
  .poll-form input:focus{outline:none; border-color:var(--deep)}
  .poll-form button{margin:0; padding:12px 20px; white-space:nowrap}
  .msg{text-align:center; font-size:.95rem; font-weight:600; min-height:1.3em; margin-top:10px}
  .top3{display:grid; gap:10px; margin-top:14px}
  .rank{position:relative; background:var(--soft); border-radius:18px; padding:12px 14px; overflow:hidden; display:flex; align-items:center; gap:10px; font-weight:700}
  .rank .fill{position:absolute; top:0; bottom:0; inset-inline-start:0; background:rgba(255,143,184,.4); transition:width .6s}
  .rank .medal, .rank .nm, .rank .ct{position:relative}
  .rank .medal{font-size:1.6rem}
  .rank .nm{flex:1; font-size:1.15rem; color:var(--deep); overflow-wrap:anywhere}
  .rank.first .nm{font-size:1.4rem}
  .rank .ct{font-size:.85rem; white-space:nowrap}
  .empty{text-align:center; margin:6px 0}
  .moretitle{text-align:center; font-weight:700; font-size:.85rem; letter-spacing:.06em; margin:18px 0 0; opacity:.8}
  .more{margin:4px 0 0; padding:0; list-style:none}
  .more li{display:flex; justify-content:space-between; gap:10px; padding:8px 14px; background:#fff7fa; border-radius:12px; margin-top:6px; font-weight:600}
  .more li span:first-child{overflow-wrap:anywhere}
</style>
</head>

<button id="lang" type="button" aria-label="Change language">עברית</button>

    <h2 id="countTitle"></h2>
    <div class="count" id="count">
      <div class="unit"><b id="d">0</b><span id="ud"></span></div>
      <div class="unit"><b id="h">0</b><span id="uh"></span></div>
      <div class="unit"><b id="m">0</b><span id="um"></span></div>
      <div class="unit"><b id="s">0</b><span id="us"></span></div>
    </div>
    <div class="done" id="done" hidden></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barlabel" id="weekLabel"></div>
  </section>

  <section class="card size">
    <h2 id="sizeTitle"></h2>
    <div class="fruit" id="emoji">🍓</div>
    <p class="big" id="fruitName"></p>
    <div class="stats">
      <div class="stat"><small id="wLabel"></small><span id="weight"></span></div>
      <div class="stat"><small id="lLabel"></small><span id="length"></span></div>
    </div>
    <p class="note" id="sizeNote"></p>
  </section>

  <section class="card" id="pollCard" hidden>
    <h2 id="pollTitle"></h2>
    <form class="poll-form" id="pollForm" autocomplete="off">
      <input id="guess" type="text" maxlength="20" enterkeyhint="send">
      <button type="submit" id="send"></button>
    </form>
    <div class="msg" id="pollMsg"></div>
    <div class="top3" id="top3"></div>
    <p class="moretitle" id="moreTitle" hidden></p>
    <ul class="more" id="more"></ul>
    <p class="note" id="pollTotal"></p>
    <p class="note" id="pollNote"></p>
  </section>

  <section class="card">
    <h2 id="quoteTitle"></h2>
    <div class="quote" id="quote"></div>
    <button id="next" type="button"></button>
  </section>

  <footer id="footer"></footer>
</main>

const squash = s => s.replace(/(.)\1+/g, "$1");
const BAD_SUB_C = BAD_SUB.map(squash);
function isBad(name){
  const t = String(name).toLowerCase()
    .replace(/0/g,"o").replace(/[1!|]/g,"i").replace(/3/g,"e")
    .replace(/[4@]/g,"a").replace(/[5$]/g,"s").replace(/7/g,"t");
  const raw = t.split(/[^\p{L}]+/u).filter(Boolean);
  // merge runs of single letters ("a s s" -> "ass") so spaced-out words are caught
  const tokens = [];
  let run = "";
  for (const w of raw){
    if ([...w].length === 1) { run += w; continue; }
    if (run) { tokens.push(run); run = ""; }
    tokens.push(w);
  }
  if (run) tokens.push(run);
  for (const w of tokens){
    const w2 = w.replace(/(.)\1{2,}/g, "$1$1");
    if (BAD_WORD.has(w) || BAD_WORD.has(w2)) return true;
  }
  const joined = squash(t.replace(/[^\p{L}]/gu, ""));
  return BAD_SUB_C.some(b => joined.includes(b));
}

  const t = T[lang];
  if (g < 1) return t.lessThan1;
  if (g >= 1000) return (g/1000).toFixed(2).replace(/\.?0+$/,"") + " " + t.kg;
  return g + " " + t.g;
}

function tick(){
  const t = T[lang];
  const now = new Date();
  const ms = due - now;
  const daysLeftTotal = ms / 86400000;
  const daysPregnant = Math.max(0, Math.min(TOTAL_DAYS, TOTAL_DAYS - daysLeftTotal));
  const weeks = Math.floor(daysPregnant / 7);
  const extra = Math.floor(daysPregnant % 7);

  if (ms <= 0) {
    $("count").hidden = true;
    $("done").hidden = false;
    $("done").textContent = t.done;
    $("sub").textContent = t.subDone;
  } else {
    $("count").hidden = false;
    $("done").hidden = true;
    $("sub").textContent = t.sub;
    $("d").textContent = Math.floor(ms/86400000);
    $("h").textContent = Math.floor(ms/3600000) % 24;
    $("m").textContent = Math.floor(ms/60000) % 60;
    $("s").textContent = Math.floor(ms/1000) % 60;
  }

  const pct = (daysPregnant / TOTAL_DAYS) * 100;
  $("bar").style.width = pct.toFixed(1) + "%";
  $("weekLabel").textContent = t.join(t.weeks(weeks), t.days(extra)) + " · " + t.journey(Math.round(pct));

  const s = sizeForWeek(weeks);
  $("emoji").textContent = s[1];
  $("fruitName").textContent = t.week(Math.max(weeks, 0)) + (lang === "he" ? s[3] : s[2]);
  $("weight").textContent = fmtWeight(s[4]);
  $("length").textContent = s[5] + " " + t.cm;
}

/* ---------- quotes ---------- */
let qi = Math.floor(Math.random() * T.en.quotes.length);
function showQuote(){
  const q = $("quote"); q.style.opacity = 0;
  setTimeout(() => { q.textContent = "“" + T[lang].quotes[qi] + "”"; q.style.opacity = 1; }, 300);
}
$("next").onclick = () => { qi = (qi + 1) % T.en.quotes.length; showQuote(); };
setInterval(() => { qi = (qi + 1) % T.en.quotes.length; showQuote(); }, 12000);

/* ---------- name guess poll (Firebase Realtime Database) ---------- */
let db = null, guesses = {}, msgKey = "";
if (typeof firebase !== "undefined" && !/YOUR_/.test(FIREBASE_CONFIG.databaseURL)) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    db.ref("guesses").on("value",
      snap => { guesses = snap.val() || {}; renderPoll(); },
      () => { msgKey = "pollErr"; renderPoll(); });
  } catch (e) { db = null; }
}

const NAME_RE = /^\p{L}[\p{L} '\-]{0,18}\p{L}$/u;
const cleanName = raw => raw.replace(/[’‘`]/g, "'").replace(/\s+/g, " ").trim();
const pretty = key => key.split(/([ \-'])/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join("");
function getMine(){ try { return localStorage.getItem("myGuess"); } catch (e) { return null; } }

function renderPoll(){
  if (!db) return;
  const t = T[lang];
  const mine = getMine();
  $("pollForm").hidden = !!mine;
  $("pollMsg").textContent = mine ? t.pollThanks(pretty(mine)) : (msgKey ? t[msgKey] : "");

  const list = Object.entries(guesses)
    .filter(([k, v]) => typeof v === "number" && v > 0 && !isBad(k))
    .map(([k, v]) => ({ name: pretty(k), n: v }))
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));

  const top = $("top3"); top.textContent = "";
  if (list.length === 0) {
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = t.pollEmpty;
    top.appendChild(p);
  }
  const maxN = list.length ? list[0].n : 1;
  const medals = ["🥇","🥈","🥉"];
  list.slice(0, 3).forEach((g, i) => {
    const row = document.createElement("div");
    row.className = "rank" + (i === 0 ? " first" : "");
    const fill = document.createElement("div");
    fill.className = "fill"; fill.style.width = Math.max(8, Math.round(g.n / maxN * 100)) + "%";
    const medal = document.createElement("span"); medal.className = "medal"; medal.textContent = medals[i];
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = g.name;
    const ct = document.createElement("span"); ct.className = "ct"; ct.textContent = t.pollCount(g.n);
    row.append(fill, medal, nm, ct);
    top.appendChild(row);
  });

  const more = $("more"); more.textContent = "";
  const rest = list.slice(3, 8);
  $("moreTitle").hidden = rest.length === 0;
  rest.forEach(g => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = g.name;
    const b = document.createElement("span"); b.textContent = t.pollCount(g.n);
    li.append(a, b);
    more.appendChild(li);
  });

  const total = list.reduce((s, g) => s + g.n, 0);
  $("pollTotal").textContent = total ? t.pollTotal(total) : "";
}

$("pollForm").addEventListener("submit", e => {
  e.preventDefault();
  if (!db) return;
  const name = cleanName($("guess").value);
  if (!NAME_RE.test(name)) { msgKey = "pollInvalid"; renderPoll(); return; }
  if (isBad(name)) { msgKey = "pollBad"; renderPoll(); return; }
  const key = name.toLowerCase();
  const btn = $("send"); btn.disabled = true;
  db.ref("guesses/" + key).transaction(c => (typeof c === "number" ? c : 0) + 1)
    .then(() => {
      try { localStorage.setItem("myGuess", key); } catch (err) {}
      msgKey = ""; $("guess").value = ""; renderPoll();
    })
    .catch(() => { msgKey = "pollErr"; renderPoll(); })
    .then(() => { btn.disabled = false; });
});

render();
setInterval(tick, 1000);

/* ---------- floating hearts ---------- */
const H = ["💗","💕","🌸","💖","🤍","🎀"];
for (let i = 0; i < 16; i++){
  const e = document.createElement("span");
  e.className = "heart"; e.textContent = H[i % H.length];
  e.style.left = Math.random()*100 + "%";
  e.style.fontSize = (14 + Math.random()*20) + "px";
  e.style.animationDuration = (10 + Math.random()*14) + "s";
  e.style.animationDelay = (-Math.random()*20) + "s";
  $("hearts").appendChild(e);
}
</script>
</body>
</html>
