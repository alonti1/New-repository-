<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd6e7">
<title>Our Little Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fb8; --deep:#e6457f; --soft:#ffe3ee; --cream:#fff8fb; --ink:#6b2c47;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffd6e7 0%,#ffe9f2 45%,#fff3e8 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  /* Hebrew uses a font that supports Hebrew letters */
  html[lang="he"] body, html[lang="he"] button{font-family:'Rubik','Quicksand',sans-serif}
  html[lang="he"] h1, html[lang="he"] .card h2{font-family:'Rubik',sans-serif; font-weight:600}
  html[lang="he"] .quote{font-style:normal}

  .hearts{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .heart{position:absolute; bottom:-40px; opacity:.55; animation:float linear infinite}
  @keyframes float{to{transform:translateY(-110vh) rotate(25deg); opacity:0}}
  main{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:28px 16px 48px}
  h1{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); text-align:center; font-size:2.1rem; margin:8px 0 4px}
  .sub{text-align:center; margin:0 0 22px; font-weight:600}
  .card{
    background:rgba(255,255,255,.82); border-radius:28px; padding:22px 18px; margin-bottom:18px;
    box-shadow:0 10px 30px rgba(230,69,127,.15); border:2px solid #fff;
  }
  .card h2{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); margin:0 0 14px; text-align:center; font-size:1.35rem}
  .count{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .unit{background:var(--soft); border-radius:18px; padding:12px 4px; text-align:center}
  .unit b{display:block; font-size:1.9rem; color:var(--deep)}
  .unit span{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .done{text-align:center; font-size:1.4rem; font-weight:700; color:var(--deep)}
  .bar{height:16px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:18px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),var(--deep)); border-radius:99px; transition:width 1s}
  .barlabel{text-align:center; font-size:.9rem; margin-top:8px}
  .size{text-align:center}
  .fruit{font-size:5rem; line-height:1; animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
  .size p{margin:6px 0}
  .big{font-size:1.25rem; font-weight:700; color:var(--deep)}
  .stats{display:flex; gap:10px; justify-content:center; margin-top:10px}
  .stat{background:var(--soft); padding:10px 16px; border-radius:16px; font-weight:700}
  .stat small{display:block; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .quote{text-align:center; font-size:1.15rem; font-style:italic; min-height:84px; display:flex; align-items:center; justify-content:center; transition:opacity .4s}
  button{
    display:block; margin:14px auto 0; border:0; background:linear-gradient(135deg,var(--pink),var(--deep));
    color:#fff; font:700 1rem 'Quicksand',sans-serif; padding:12px 26px; border-radius:99px;
    box-shadow:0 6px 16px rgba(230,69,127,.35); cursor:pointer;
  }
  button:active{transform:scale(.96)}
  #lang{
    position:fixed; top:12px; inset-inline-end:12px; z-index:5; margin:0;
    padding:8px 16px; font-size:.9rem; background:rgba(255,255,255,.9); color:var(--deep);
    box-shadow:0 4px 12px rgba(230,69,127,.25); border:2px solid var(--pink);
  }
  footer{text-align:center; font-size:.9rem; margin-top:8px}
  .note{font-size:.75rem; opacity:.7; text-align:center; margin-top:8px}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<button id="lang" type="button" aria-label="Change language">עברית</button>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section class="card">
    <h2 id="countTitle"></h2>
    <div class="count" id="count">
      <div class="unit"><b id="d">0</b><span id="ud"></span></div>
      <div class="unit"><b id="h">0</b><span id="uh"></span></div>
      <div class="unit"><b id="m">0</b><span id="um"></span></div>
      <div class="unit"><b id="s">0</b><span id="us"></span></div>
    </div>
    <div class="done" id="done" hidden></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barlabel" id="weekLabel"></div>
  </section>

  <section class="card size">
    <h2 id="sizeTitle"></h2>
    <div class="fruit" id="emoji">🍓</div>
    <p class="big" id="fruitName"></p>
    <div class="stats">
      <div class="stat"><small id="wLabel"></small><span id="weight"></span></div>
      <div class="stat"><small id="lLabel"></small><span id="length"></span></div>
    </div>
    <p class="note" id="sizeNote"></p>
  </section>

  <section class="card">
    <h2 id="quoteTitle"></h2>
    <div class="quote" id="quote"></div>
    <button id="next" type="button"></button>
  </section>

  <footer id="footer"></footer>
</main>

<script>
/* ====== EDIT THESE LINES ====== */
const DUE_DATE = "2027-01-28";   // estimated due date, format YYYY-MM-DD
const HER_NAME = "Guga";             // her name or nickname (leave "" to hide)
const FROM_NAME = "Gugu";            // your name or nickname (leave "" to hide)
const HER_NAME_HE = "גוגה";          // optional: her name in Hebrew letters (leave "" to use the one above)
const FROM_NAME_HE = "גוגו";         // optional: your name in Hebrew letters (leave "" to use the one above)
/* =============================== */

/* ---------- text in both languages ---------- */
const T = {
  en: {
    title: "Our Little Countdown",
    titleWithName: n => n + " & Baby 💗",
    sub: "Until we meet our baby 💕",
    subDone: "The big day has arrived 💕",
    countTitle: "Time until the big day",
    units: ["days","hours","mins","secs"],
    done: "Any moment now... or baby is here! 👶💕",
    sizeTitle: "Baby is about the size of...",
    weight: "Weight", length: "Length",
    cm: "cm", g: "g", kg: "kg", lessThan1: "< 1 g",
    note: "Sizes are rough averages 🌸",
    quoteTitle: "A little love note",
    next: "Another one 💌",
    footer: "With all my love 💖",
    footerWithName: n => "With all my love, " + n + " 💖",
    week: w => "Week " + w + ": ",
    weeks: w => w + (w === 1 ? " week" : " weeks"),
    days: d => d + (d === 1 ? " day" : " days"),
    join: (a, b) => a + ", " + b,
    journey: p => p + "% of the journey 🌷",
    quotes: [
      "Every day with you is my favorite day, and soon we get to add one more person to love.",
      "You're not just growing a baby, you're growing our whole world.",
      "I fall in love with you a little more every single morning.",
      "Home is wherever you are, and now it's getting even bigger.",
      "Thank you for being the strongest, softest, most beautiful mom-to-be.",
      "Our little one already has the best mom in the world.",
      "You make the ordinary feel like magic.",
      "I can't wait to see your smile in our baby's face.",
      "Whatever comes next, I'm yours and we're in this together.",
      "You are my today and all of my tomorrows.",
      "Little hands, little feet, and a whole lot of love on the way.",
      "You are the reason I believe in happily ever after.",
      "Look at us, building a family. I'm the luckiest.",
      "Rest, my love. You're doing something miraculous.",
      "With you, forever still feels too short."
    ]
  },
  he: {
    title: "הספירה לאחור שלנו",
    titleWithName: n => n + " והתינוקת 💗",
    sub: "עד שנפגוש את התינוקת שלנו 💕",
    subDone: "היום הגדול הגיע 💕",
    countTitle: "הזמן עד היום הגדול",
    units: ["ימים","שעות","דקות","שניות"],
    done: "כל רגע עכשיו... או שהתינוקת כבר כאן! 👶💕",
    sizeTitle: "התינוקת בגודל של...",
    weight: "משקל", length: "אורך",
    cm: "ס״מ", g: "גרם", kg: "ק״ג", lessThan1: "פחות מ-1 גרם",
    note: "הגדלים הם ממוצעים משוערים 🌸",
    quoteTitle: "פתק אהבה קטן",
    next: "עוד אחד 💌",
    footer: "באהבה גדולה 💖",
    footerWithName: n => "באהבה, " + n + " 💖",
    week: w => "שבוע " + w + ": ",
    weeks: w => w === 1 ? "שבוע" : w === 2 ? "שבועיים" : w + " שבועות",
    days: d => d === 1 ? "יום" : d === 2 ? "יומיים" : d + " ימים",
    join: (a, b) => a + (/^\d/.test(b) ? " ו-" : " ו") + b,
    journey: p => p + "% מהדרך 🌷",
    quotes: [
      "כל יום איתך הוא היום האהוב עליי, ובקרוב יהיה עוד מישהו קטן שנאהב.",
      "את לא רק מגדלת תינוקת, את מגדלת את כל העולם שלנו.",
      "אני מתאהב בך קצת יותר בכל בוקר מחדש.",
      "הבית הוא איפה שאת, ועכשיו הוא הולך ונהיה גדול עוד יותר.",
      "תודה שאת האמא המחכה החזקה, הרכה והיפה ביותר.",
      "לקטנטן שלנו כבר יש את האמא הכי טובה בעולם.",
      "את הופכת את הרגיל לקסם.",
      "אני לא יכול לחכות לראות את החיוך שלך על הפנים של התינוקת שלנו.",
      "מה שלא יבוא, אני שלך ואנחנו יחד בזה.",
      "את היום שלי וכל המחר שלי.",
      "ידיים קטנות, רגליים קטנות, והרבה מאוד אהבה בדרך.",
      "את הסיבה שאני מאמין באושר ועד עולם.",
      "תראי אותנו, בונים משפחה. אני בר המזל ביותר.",
      "תנוחי, אהובתי. את עושה משהו מופלא.",
      "איתך, לנצח עדיין מרגיש קצר מדי."
    ]
  }
};

// [week, emoji, English name, Hebrew name, weight in grams, length in cm]
const SIZES = [
[4,"🌱","a poppy seed","גרגיר פרג",0,0.1],[5,"🌱","a sesame seed","גרגיר שומשום",0,0.2],[6,"🫘","a lentil","עדשה",0,0.6],
[7,"🫐","a blueberry","אוכמנית",0,1.3],[8,"🍇","a raspberry","פטל",1,1.6],[9,"🍒","a cherry","דובדבן",2,2.3],
[10,"🍓","a strawberry","תות",4,3.1],[11,"🥭","a fig","תאנה",7,4.1],[12,"🍋‍🟩","a lime","ליים",14,5.4],
[13,"🍑","a peach","אפרסק",23,7.4],[14,"🍋","a lemon","לימון",43,8.7],[15,"🍎","an apple","תפוח",70,10.1],
[16,"🥑","an avocado","אבוקדו",100,11.6],[17,"🍐","a pear","אגס",140,13],[18,"🫑","a bell pepper","פלפל",190,14.2],
[19,"🥭","a mango","מנגו",240,15.3],[20,"🍌","a banana","בננה",300,25.6],[21,"🥕","a carrot","גזר",360,26.7],
[22,"🥭","a papaya","פפאיה",430,27.8],[23,"🍊","a grapefruit","אשכולית",500,28.9],[24,"🌽","an ear of corn","קלח תירס",600,30],
[25,"🥦","a cauliflower","כרובית",660,34.6],[26,"🥬","a head of lettuce","ראש חסה",760,35.6],[27,"🥦","a cauliflower","כרובית",875,36.6],
[28,"🍆","an eggplant","חציל",1005,37.6],[29,"🎃","a butternut squash","דלעת בטרנאט",1150,38.6],[30,"🥬","a cabbage","כרוב",1320,39.9],
[31,"🥥","a coconut","קוקוס",1500,41.1],[32,"🥔","a jicama","ג'יקמה",1700,42.4],[33,"🍍","a pineapple","אננס",1920,43.7],
[34,"🍈","a cantaloupe","מלון קנטלופ",2150,45],[35,"🍈","a honeydew melon","מלון",2380,46.2],[36,"🥬","a romaine lettuce","חסה רומית",2620,47.4],
[37,"🥬","a bunch of Swiss chard","צרור מנגולד",2860,48.6],[38,"🧅","a leek","כרישה",3080,49.8],[39,"🍉","a mini watermelon","אבטיח קטן",3290,50.7],
[40,"🎃","a little pumpkin","דלעת קטנה",3460,51.2]
];

const $ = id => document.getElementById(id);
const due = new Date(DUE_DATE + "T00:00:00");
const TOTAL_DAYS = 280;

/* ---------- language handling ---------- */
let lang = "en";
try {
  const saved = localStorage.getItem("lang");
  if (saved === "he" || saved === "en") lang = saved;
  else if ((navigator.language || "").toLowerCase().startsWith("he")) lang = "he";
} catch (e) {
  if ((navigator.language || "").toLowerCase().startsWith("he")) lang = "he";
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  render();
}
$("lang").onclick = () => setLang(lang === "en" ? "he" : "en");

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  $("lang").textContent = lang === "en" ? "עברית" : "English";

  const her = lang === "he" ? (HER_NAME_HE || HER_NAME) : HER_NAME;
  const from = lang === "he" ? (FROM_NAME_HE || FROM_NAME) : FROM_NAME;
  const heading = her ? t.titleWithName(her) : t.title;
  $("title").textContent = heading;
  document.title = heading;
  $("footer").textContent = from ? t.footerWithName(from) : t.footer;

  $("countTitle").textContent = t.countTitle;
  ["ud","uh","um","us"].forEach((id, i) => $(id).textContent = t.units[i]);
  $("sizeTitle").textContent = t.sizeTitle;
  $("wLabel").textContent = t.weight;
  $("lLabel").textContent = t.length;
  $("sizeNote").textContent = t.note;
  $("quoteTitle").textContent = t.quoteTitle;
  $("next").textContent = t.next;
  $("quote").textContent = "“" + t.quotes[qi] + "”";
  tick();
}

/* ---------- countdown ---------- */
function sizeForWeek(w){
  w = Math.max(4, Math.min(40, w));
  return SIZES.find(x => x[0] === w);
}
function fmtWeight(g){
  const t = T[lang];
  if (g < 1) return t.lessThan1;
  if (g >= 1000) return (g/1000).toFixed(2).replace(/\.?0+$/,"") + " " + t.kg;
  return g + " " + t.g;
}

function tick(){
  const t = T[lang];
  const now = new Date();
  const ms = due - now;
  const daysLeftTotal = ms / 86400000;
  const daysPregnant = Math.max(0, Math.min(TOTAL_DAYS, TOTAL_DAYS - daysLeftTotal));
  const weeks = Math.floor(daysPregnant / 7);
  const extra = Math.floor(daysPregnant % 7);

  if (ms <= 0) {
    $("count").hidden = true;
    $("done").hidden = false;
    $("done").textContent = t.done;
    $("sub").textContent = t.subDone;
  } else {
    $("count").hidden = false;
    $("done").hidden = true;
    $("sub").textContent = t.sub;
    $("d").textContent = Math.floor(ms/86400000);
    $("h").textContent = Math.floor(ms/3600000) % 24;
    $("m").textContent = Math.floor(ms/60000) % 60;
    $("s").textContent = Math.floor(ms/1000) % 60;
  }

  const pct = (daysPregnant / TOTAL_DAYS) * 100;
  $("bar").style.width = pct.toFixed(1) + "%";
  $("weekLabel").textContent = t.join(t.weeks(weeks), t.days(extra)) + " · " + t.journey(Math.round(pct));

  const s = sizeForWeek(weeks);
  $("emoji").textContent = s[1];
  $("fruitName").textContent = t.week(Math.max(weeks, 0)) + (lang === "he" ? s[3] : s[2]);
  $("weight").textContent = fmtWeight(s[4]);
  $("length").textContent = s[5] + " " + t.cm;
}

/* ---------- quotes ---------- */
let qi = Math.floor(Math.random() * T.en.quotes.length);
function showQuote(){
  const q = $("quote"); q.style.opacity = 0;
  setTimeout(() => { q.textContent = "“" + T[lang].quotes[qi] + "”"; q.style.opacity = 1; }, 300);
}
$("next").onclick = () => { qi = (qi + 1) % T.en.quotes.length; showQuote(); };
setInterval(() => { qi = (qi + 1) % T.en.quotes.length; showQuote(); }, 12000);

render();
setInterval(tick, 1000);

/* ---------- floating hearts ---------- */
const H = ["💗","💕","🌸","💖","🤍","🎀"];
for (let i = 0; i < 16; i++){
  const e = document.createElement("span");
  e.className = "heart"; e.textContent = H[i % H.length];
  e.style.left = Math.random()*100 + "%";
  e.style.fontSize = (14 + Math.random()*20) + "px";
  e.style.animationDuration = (10 + Math.random()*14) + "s";
  e.style.animationDelay = (-Math.random()*20) + "s";
  $("hearts").appendChild(e);
}
</script>
</body>
</html>
