<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffd6e7">
<title>Our Little Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fb8; --deep:#e6457f; --soft:#ffe3ee; --cream:#fff8fb; --ink:#6b2c47;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffd6e7 0%,#ffe9f2 45%,#fff3e8 100%);
    background-attachment:fixed; overflow-x:hidden;
  }
  .hearts{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .heart{position:absolute; bottom:-40px; opacity:.55; animation:float linear infinite}
  @keyframes float{to{transform:translateY(-110vh) rotate(25deg); opacity:0}}
  main{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:28px 16px 48px}
  h1{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); text-align:center; font-size:2.1rem; margin:8px 0 4px}
  .sub{text-align:center; margin:0 0 22px; font-weight:600}
  .card{
    background:rgba(255,255,255,.82); border-radius:28px; padding:22px 18px; margin-bottom:18px;
    box-shadow:0 10px 30px rgba(230,69,127,.15); border:2px solid #fff;
  }
  .card h2{font-family:'Pacifico',cursive; font-weight:400; color:var(--deep); margin:0 0 14px; text-align:center; font-size:1.35rem}
  .count{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .unit{background:var(--soft); border-radius:18px; padding:12px 4px; text-align:center}
  .unit b{display:block; font-size:1.9rem; color:var(--deep)}
  .unit span{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .bar{height:16px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:18px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),var(--deep)); border-radius:99px; transition:width 1s}
  .barlabel{text-align:center; font-size:.9rem; margin-top:8px}
  .size{text-align:center}
  .fruit{font-size:5rem; line-height:1; animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
  .size p{margin:6px 0}
  .big{font-size:1.25rem; font-weight:700; color:var(--deep)}
  .stats{display:flex; gap:10px; justify-content:center; margin-top:10px}
  .stat{background:var(--soft); padding:10px 16px; border-radius:16px; font-weight:700}
  .stat small{display:block; font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em}
  .quote{text-align:center; font-size:1.15rem; font-style:italic; min-height:84px; display:flex; align-items:center; justify-content:center; transition:opacity .4s}
  button{
    display:block; margin:14px auto 0; border:0; background:linear-gradient(135deg,var(--pink),var(--deep));
    color:#fff; font:700 1rem 'Quicksand',sans-serif; padding:12px 26px; border-radius:99px;
    box-shadow:0 6px 16px rgba(230,69,127,.35); cursor:pointer;
  }
  button:active{transform:scale(.96)}
  footer{text-align:center; font-size:.9rem; margin-top:8px}
  .note{font-size:.75rem; opacity:.7; text-align:center; margin-top:8px}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main>
  <h1 id="title">Our Little Countdown</h1>
  <p class="sub" id="sub">Until we meet our baby 💕</p>

  <section class="card">
    <h2>Time until the big day</h2>
    <div class="count" id="count">
      <div class="unit"><b id="d">0</b><span>days</span></div>
      <div class="unit"><b id="h">0</b><span>hours</span></div>
      <div class="unit"><b id="m">0</b><span>mins</span></div>
      <div class="unit"><b id="s">0</b><span>secs</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="barlabel" id="weekLabel"></div>
  </section>

  <section class="card size">
    <h2>Baby is about the size of...</h2>
    <div class="fruit" id="emoji">🍓</div>
    <p class="big" id="fruitName"></p>
    <div class="stats">
      <div class="stat"><small>Weight</small><span id="weight"></span></div>
      <div class="stat"><small>Length</small><span id="length"></span></div>
    </div>
    <p class="note">Sizes are rough averages 🌸</p>
  </section>

  <section class="card">
    <h2>A little love note</h2>
    <div class="quote" id="quote"></div>
    <button id="next">Another one 💌</button>
  </section>

  <footer id="footer">With all my love 💖</footer>
</main>

<script>
/* ====== EDIT THESE THREE LINES ====== */
const DUE_DATE = "2027-01-28";      // estimated due date, format YYYY-MM-DD
const HER_NAME = "Guga";           // e.g. "Sarah" (leave "" to hide)
const FROM_NAME = "Gugu";            // e.g. "Your husband" (leave "" to hide)
/* ===================================== */

// [week, emoji, name, weight in grams, length in cm]
const SIZES = [
[4,"🌱","a poppy seed",0,0.1],[5,"🌱","a sesame seed",0,0.2],[6,"🫘","a lentil",0,0.6],
[7,"🫐","a blueberry",0,1.3],[8,"🍇","a raspberry",1,1.6],[9,"🍒","a cherry",2,2.3],
[10,"🍓","a strawberry",4,3.1],[11,"🥭","a fig",7,4.1],[12,"🍋‍🟩","a lime",14,5.4],
[13,"🍑","a peach",23,7.4],[14,"🍋","a lemon",43,8.7],[15,"🍎","an apple",70,10.1],
[16,"🥑","an avocado",100,11.6],[17,"🍐","a pear",140,13],[18,"🫑","a bell pepper",190,14.2],
[19,"🥭","a mango",240,15.3],[20,"🍌","a banana",300,25.6],[21,"🥕","a carrot",360,26.7],
[22,"🥭","a papaya",430,27.8],[23,"🍊","a grapefruit",500,28.9],[24,"🌽","an ear of corn",600,30],
[25,"🥦","a cauliflower",660,34.6],[26,"🥬","a head of lettuce",760,35.6],[27,"🥦","a cauliflower",875,36.6],
[28,"🍆","an eggplant",1005,37.6],[29,"🎃","a butternut squash",1150,38.6],[30,"🥬","a cabbage",1320,39.9],
[31,"🥥","a coconut",1500,41.1],[32,"🥔","a jicama",1700,42.4],[33,"🍍","a pineapple",1920,43.7],
[34,"🍈","a cantaloupe",2150,45],[35,"🍈","a honeydew melon",2380,46.2],[36,"🥬","a romaine lettuce",2620,47.4],
[37,"🥬","a bunch of Swiss chard",2860,48.6],[38,"🧅","a leek",3080,49.8],[39,"🍉","a mini watermelon",3290,50.7],
[40,"🎃","a little pumpkin",3460,51.2]
];

const QUOTES = [
"Every day with you is my favorite day, and soon we get to add one more person to love.",
"You're not just growing a baby, you're growing our whole world.",
"I fall in love with you a little more every single morning.",
"Home is wherever you are, and now it's getting even bigger.",
"Thank you for being the strongest, softest, most beautiful mom-to-be.",
"Our little one already has the best mom in the world.",
"You make the ordinary feel like magic.",
"I can't wait to see your smile in our baby's face.",
"Whatever comes next, I'm yours and we're in this together.",
"You are my today and all of my tomorrows.",
"Little hands, little feet, and a whole lot of love on the way.",
"You are the reason I believe in happily ever after.",
"Look at us, building a family. I'm the luckiest.",
"Rest, my love. You're doing something miraculous.",
"With you, forever still feels too short."
];

const $ = id => document.getElementById(id);
const due = new Date(DUE_DATE + "T00:00:00");
const TOTAL_DAYS = 280;

if (HER_NAME) { $("title").textContent = HER_NAME + " & Baby 💗"; }
if (FROM_NAME) { $("footer").textContent = "With all my love, " + FROM_NAME + " 💖"; }

function sizeForWeek(w){
  w = Math.max(4, Math.min(40, w));
  return SIZES.find(x => x[0] === w);
}
function fmtWeight(g){
  if (g < 1) return "< 1 g";
  if (g >= 1000) return (g/1000).toFixed(2).replace(/\.?0+$/,"") + " kg";
  return g + " g";
}

function tick(){
  const now = new Date();
  let ms = due - now;
  const daysLeftTotal = ms / 86400000;
  const daysPregnant = Math.max(0, Math.min(TOTAL_DAYS, TOTAL_DAYS - daysLeftTotal));
  const weeks = Math.floor(daysPregnant / 7);
  const extra = Math.floor(daysPregnant % 7);

  if (ms <= 0) {
    $("count").innerHTML = '<div style="grid-column:1/-1;text-align:center;font-size:1.4rem;font-weight:700;color:#e6457f">Any moment now... or baby is here! 👶💕</div>';
    $("sub").textContent = "The big day has arrived 💕";
    ms = 0;
  } else {
    $("d").textContent = Math.floor(ms/86400000);
    $("h").textContent = Math.floor(ms/3600000) % 24;
    $("m").textContent = Math.floor(ms/60000) % 60;
    $("s").textContent = Math.floor(ms/1000) % 60;
  }

  const pct = (daysPregnant / TOTAL_DAYS) * 100;
  $("bar").style.width = pct.toFixed(1) + "%";
  $("weekLabel").textContent = weeks + " weeks, " + extra + " days · " + Math.round(pct) + "% of the journey 🌷";

  const s = sizeForWeek(weeks);
  $("emoji").textContent = s[1];
  $("fruitName").textContent = "Week " + Math.max(weeks,0) + ": " + s[2];
  $("weight").textContent = fmtWeight(s[3]);
  $("length").textContent = s[4] + " cm";
}
tick(); setInterval(tick, 1000);

/* quotes */
let qi = Math.floor(Math.random() * QUOTES.length);
function showQuote(){
  const q = $("quote"); q.style.opacity = 0;
  setTimeout(() => { q.textContent = "“" + QUOTES[qi] + "”"; q.style.opacity = 1; }, 300);
}
$("next").onclick = () => { qi = (qi + 1) % QUOTES.length; showQuote(); };
$("quote").textContent = "“" + QUOTES[qi] + "”";
setInterval(() => { qi = (qi + 1) % QUOTES.length; showQuote(); }, 12000);

/* floating hearts */
const H = ["💗","💕","🌸","💖","🤍","🎀"];
for (let i = 0; i < 16; i++){
  const e = document.createElement("span");
  e.className = "heart"; e.textContent = H[i % H.length];
  e.style.left = Math.random()*100 + "%";
  e.style.fontSize = (14 + Math.random()*20) + "px";
  e.style.animationDuration = (10 + Math.random()*14) + "s";
  e.style.animationDelay = (-Math.random()*20) + "s";
  $("hearts").appendChild(e);
}
</script>
</body>
</html>
